[package]
name = "harrier"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Harrier, the fleet guardian for Wazuh: hardware-bound agent identity, self-healing and inventory hygiene"
repository = "https://github.com/omidiyanto/harrier"
publish = false

# Intentionally empty: std + the OS only (curl is used as an external program
# by `reconcile`, never linked).
[dependencies]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"
